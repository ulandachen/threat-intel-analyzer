[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-intel-analyzer"
version = "0.1.0"
description = "A Python CLI for normalizing, deduplicating, and prioritizing cyber threat intelligence indicators."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ulanda Chen"}]
keywords = ["cybersecurity", "threat-intelligence", "cti", "mitre-attack", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
threat-intel = "threat_intel_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
